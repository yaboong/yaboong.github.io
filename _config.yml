# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site title
title: "YABOONG"

# A description of your site for social meta tag, search engines, and feed.xml
description: "Flying Yaboong | Byte to Flight"

# Tagline near the site title
tagline: "Done with coding, ready for takeoff ✈️"
# My code finally took off
# From code to cockpit
# Beyond the code, into the clouds
# Code to Clouds
# My code finally took off


# The subpath of your site, e.g. /blog, for generating urls
baseurl:

sass:
  sass_dir: _sass

# The base hostname & protocol of your site for where absolute urls are needed
url: "https://yaboong.github.io"

# Top-level sections: /flying/ and /checkride/ list these categories, /cs/ lists all others
flying_categories: [aviation-experience, FAR/AIM]
checkride_categories: [aviation]
# Display names for categories (category values stay as-is so post URLs don't change)
category_labels:
  aviation: "Checkride"
  aviation-experience: "Flight Experiences"

# Site navigation - each item must have a title and a url.
navigation:
- text: Home
  url: /
- text: About
  url: /about/
- text: Flying
  url: /flying/
- text: Checkride
  url: /checkride/
- text: NavLog
  url: /navlog/
# - text: CFI Lesson Plan   # hidden until ready (page still at /cfi-lesson-plan/)
#   url: /cfi-lesson-plan/
- text: ATC Tool
  url: /atc-tool/
- text: CS
  url: /cs/

# The shortname for your Disqus site to enable comments.
# disqus: yaboong-github-io
disqus: false

# Author information - author info at the bottom of the post
author_name: "Yaboong"
author_bio: "Software engineer for seven years, now a pilot. CPL/IR, working toward CFI and the airline. Writing down what I learn along the way."
author_url:  "https://github.com/yaboong"
author_location: "Massachusetts, US"
author_image: /images/yaboong.jpeg
author_linkedin: "https://www.linkedin.com/in/yebonyou/"
author_email: "yebonyou@gmail.com"
author_youtube: "https://www.youtube.com/@flyb-hm5yj"

# Sidebar Add banner
banner_url: "https://github.com/yaboong"
banner_image: images/yaboong.jpeg
banner_prefix: "/yaboong-blog-static-resources/banner/"

# Sidebar newsletter widget - add your form action url for MailChimp signup form here
# mailchimp_url: "//justgoodthemes.us3.list-manage.com/subscribe/post?u=78f1bab16028354caeb23aecd&amp;id=4a7330d117"

# Social links in the site footer
#twitter_username: "username"
# facebook_username: "yabooong"
# googleplus_username: "u/0/101688448325229683345"
github_username: "yaboong"
#codepen_username: "username"
#dribbble_uername: "username"
#medium_username: "@username"
# instagram_username: "yaboooong"
#pinterest_username: "username"
#linkedin_username: "username"
#weibo_username: "username"

# http://jekyllrb.com/docs/pagination/
paginate: 10
paginate_path: '/blog/page:num/'
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-gist
  - jekyll-sitemap
permalink: pretty
markdown: kramdown
highlighter: rouge
exclude:
  - node_modules

# Google Analytics
google_analytics: UA-113745841-1

# CFI lesson plans (separate from posts, listed on /cfi-lesson-plan/)
collections:
  cfi_lessons:
    output: true
    permalink: /cfi-lesson-plan/:name/
defaults:
  - scope:
      path: ""
      type: cfi_lessons
    values:
      layout: cfi_lesson
      sitemap: false  # set sitemap: true per lesson once its content is written

# for ffmpeg
include:
  - assets
  - _pages
