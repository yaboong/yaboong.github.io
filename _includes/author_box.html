<div class="author-box">
    <div class="author-info">
        <div class="author-avatar" style="background-image: url({{ site.author_image }})"><span class="screen-reader-text">{{ site.author_name }}'s Picture</span></div>
        <div class="author-details">
            <h2 class="author-title">{{ site.author_name }}</h2>
            <p class="author-bio">{{ site.author_bio }} <a class="author-more" href="{{ site.baseurl }}/about/">More about me &rarr;</a></p>
            <span class="author-location"><i class="fa-map-marker" aria-hidden="true"></i> {{ site.author_location }}</span>
<!--                        <a target="_blank" href="{{ site.author_linkedin }}"><img width="24" height="24" src="/images/icons8-linkedin-48.png" alt="linkedin"/></a>-->
            <a href="mailto:{{ site.author_email }}"><img width="24" height="24" src="/images/icons8-gmail-96.png" alt="gmail"/></a>
            {% if site.author_youtube %}<a target="_blank" rel="noopener" href="{{ site.author_youtube }}" class="author-youtube" title="YouTube"><i class="fa-youtube-play" aria-hidden="true"></i><span class="screen-reader-text">YouTube</span></a>{% endif %}
<!--                        <span class="author-website"><i class="fa-chain" aria-hidden="true"></i> <a href="{{ site.author_url }}" target="_blank"> {{ site.author_url }}</a></span>-->
        </div><!-- .author-details -->
    </div><!-- .author-info -->
</div><!-- .author-box -->
