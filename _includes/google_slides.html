{% comment %} 16:9 slide + Google's 29px player toolbar (960x569, 1440x839) {% endcomment %}
<div class="google-slides" style="position:relative; width:100%; height:0; padding-bottom:calc(56.25% + 29px); margin-bottom:1.5em;">
    <iframe src="{{ include.src }}" title="{{ include.title | default: 'Google Slides' }}" style="position:absolute; inset:0; width:100%; height:100%; border:0;" loading="lazy" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
</div>
