---
layout: default
---
{% assign area = site.data.cfi_acs.areas | where: "num", page.area | first %}
<div class="site-content">
    <div class="inner">
        <main class="site-main">
            <article class="post">
                <header class="entry-header">
                    <div class="entry-header-wrap">
                        <h1 class="entry-title">{{page.title}}</h1>
                    </div><!-- .entry-header-wrap -->
                    <div class="entry-meta">
                        <a href="{{ '/cfi-lesson-plan/' | prepend: site.baseurl }}">CFI Lesson Plan</a>{% if area %} › Area of Operation {{ area.roman }}. {{ area.title }}{% endif %}
                    </div><!-- .entry-meta -->
                </header><!-- .entry-header -->
                <div class="entry-content">
                    {{content}}
                </div><!-- .entry-content -->
            </article><!-- .post -->
        </main><!-- .site-main -->
        {% include sidebar.html %}
    </div><!-- .inner -->
</div><!-- .site-content -->
